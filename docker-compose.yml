services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      APP_ADDR: ":${APP_PORT:-8080}"
      DATA_DIR: ${DATA_DIR:-/app/data}
      WEB_DIST_DIR: /app/web/dist
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
      MIX_TIMEOUT: ${MIX_TIMEOUT:-10m}
      MAX_CONCURRENT_MIXES: ${MAX_CONCURRENT_MIXES:-1}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${APP_PORT:-8080}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
